modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = '''${mod_license}'''

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "mixins.draconicevolution.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "codechickenlib"
type = "required"
versionRange = "[4.7.0,)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "brandonscore"
type = "required"
versionRange = "[3.2.1,)"
ordering = "AFTER"
side = "BOTH"
# port-26.1.2: computercraft optional (integration compiles against forge-api)
[[dependencies.${mod_id}]]
modId = "computercraft"
type = "optional"
versionRange = "[1.120.0,)"
ordering = "AFTER"
side = "BOTH"
# port-26.1.2: curios optional (used at runtime via ModList checks)
[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[15.0.0,)"
ordering = "AFTER"
side = "BOTH"

// port-26.1.2: gradle-layer rewrite по эталону evolved-mekanism-26.1.2 (moddev 2.0.143, ловушки 14/26/35/36)

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143' // port-26.1.2: fleet version (trap 14)
}

group = "com.brandon3055.draconicevolution"
base {
    archivesName = 'Draconic-Evolution'
}
version = "${mc_version}-${mod_version}-port.1"

sourceSets.main.resources.srcDirs += "src/main/generated"

java.toolchain.languageVersion = JavaLanguageVersion.of(25) // port-26.1.2: Java 25

neoForge {
    version = project.neo_version

    accessTransformers = project.files("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = project.file('run/server') // port-26.1.2: QA RUNDIR (skill mc-fleet-build-qa)
            programArgument '--nogui'
        }
        // port-26.1.2: run-type "data" has been removed (trap 66) -> serverData/clientData
        serverData {
            serverData()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/main/generated').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        clientData {
            clientData()
            gameDirectory = project.file('run/data')
        }
    }

    // port-26.1.2: without the mods section, the mod is silently NOT included in the run (trap 26)
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// EnderCollection uses an optional boundary to the actual installed EnderStorage API.
sourceSets {
    main {
        java {
            // port-26.1.2: datagen-кластер исключён до этапа datagen (ExistingFileHelper/модельные генераторы 26) — см. stage1/2 отчёт
            exclude 'com/brandon3055/draconicevolution/datagen/**'
        }
    }
}

repositories {
    mavenLocal() // port-26.1.2: EMI 26.1.2

    maven { url = "https://chickenbones.net/maven" }
    maven {
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        url = "https://maven.squiddev.cc/"
        content { includeGroup "cc.tweaked" }
    }
}

dependencies {
    // port-26.1.2: fleet jars (CCL port.2 is NOT in mavenLocal - direct fileTree, same as in BrandonsCore build.gradle)
    implementation files('../../mi-stack/BrandonsCore/build/libs/BrandonsCore-' + bcore_version + '.jar')
    implementation files('../../mi-stack/CodeChickenLib/build/libs/codechickenlib-' + ccl_version + '.jar')
    // port-26.1.2: Quack (mavenLocal 0.4.10.130) - использовался DE напрямую (SneakyUtils/CrashLock/FastStream)
    implementation 'net.covers1624:Quack:0.4.10.130'

    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    compileOnly "cc.tweaked:cc-tweaked-${mc_version}-forge-api:${cct_version}"

    // port-26.1.2: JEI removed (EMI-only policy), src/**/jei/** deleted

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            mc_version             : mc_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000'] // port-26.1.2: remove the default limit of 100 (trap 69)
}

jar {
    manifest {
        attributes 'Specification-Title': base.archivesName.get()
        attributes 'Specification-Vendor': 'brandon3055'
        attributes 'Specification-Version': "1"
        attributes 'Implementation-Title': base.archivesName.get()
        attributes 'Implementation-Vendor': 'brandon3055'
        attributes 'Implementation-Version': version
        attributes 'MixinConfigs': 'mixins.draconicevolution.json'
    }
}

// port-26.1.2: signing/publishing/publishMods removed - not needed for the port
